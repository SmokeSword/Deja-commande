<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Déjà commandé ?</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#14213d;--mut:#6b7280;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--pri:#14213d;--onpri:#fff;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f29;--txt:#f3f4f6;--mut:#9ca3af;--ok:#86efac;--okbg:#14351f;--warn:#fcd34d;--warnbg:#3a2e0b;--bad:#fca5a5;--badbg:#3b1414;--pri:#e5e7eb;--onpri:#0f1218;--line:#2a3140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;color:var(--mut);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.store{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.name{font-weight:600;margin:2px 0 10px;word-break:break-word}
.verdict{border-radius:10px;padding:12px;font-weight:600;margin-bottom:12px}
.verdict small{display:block;font-weight:400;margin-top:2px}
.v-ok{background:var(--okbg);color:var(--ok)}
.v-warn{background:var(--warnbg);color:var(--warn)}
.v-bad{background:var(--badbg);color:var(--bad)}
input[type=text],input[type=search],input:not([type]){width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font:inherit}
.btns{display:flex;gap:8px;margin-top:10px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:12px 10px;cursor:pointer}
.btns button{flex:1;font-weight:600}
.btns button.on,button.primary{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:12px;color:var(--mut)}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px}
.b-commande{background:var(--warnbg);color:var(--warn)}
.b-renvoye{background:var(--badbg);color:var(--bad)}
.b-garde{background:var(--okbg);color:var(--ok)}
.del{border:0;background:none;color:var(--mut);padding:6px 10px;font-size:20px}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
.top h1{margin:0;cursor:pointer}
#homebtn{padding:8px 12px;font-size:14px;white-space:nowrap}
.note{flex-basis:100%;font-size:13px;opacity:.85;font-weight:400}
.lines{font-weight:400;margin-top:8px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(128,128,128,.35);cursor:pointer}
.line .sz{flex:1}
.line .d{font-size:12px;opacity:.8}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.hint{color:var(--mut);font-size:13px;margin:6px 2px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="top"><h1 id="home">Déjà commandé ?</h1><button id="homebtn" hidden>🏠 Accueil</button></div>

<div id="current"></div>

<div class="card">
  <div class="row">
    <input id="paste" type="text" placeholder="Coller un lien d'article" inputmode="url" autocomplete="off">
    <button id="check" class="primary">Vérifier</button>
  </div>
  <p class="hint">Astuce : dans l'app Zalando ou Zara, utilise « Partager » puis choisis cette app.</p>
</div>

<h2>Mon historique</h2>
<input id="search" type="search" placeholder="Rechercher (nom, magasin, taille)">
<div class="card" id="list" style="margin-top:10px"></div>

<div class="tools">
  <button id="export">Sauvegarder</button>
  <button id="import">Restaurer</button>
  <input id="file" type="file" accept="application/json" hidden>
</div>
<p class="hint">Tes données restent uniquement sur ce téléphone. Utilise « Sauvegarder » de temps en temps.</p>

<div id="toast"></div>

<script>
const KEY = 'dejacommande.v1';
const LABELS = { commande: 'Commandé', renvoye: 'Renvoyé', garde: 'Gardé' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let items = load();
let current = null;

function migrate(i) { if (i && !i.id) i.id = i.key + '|' + String(i.size || '').trim().toLowerCase(); return i; }
function load() { try { return (JSON.parse(localStorage.getItem(KEY)) || []).map(migrate); } catch (e) { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { toast('Erreur de sauvegarde'); } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('fr-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }); }

function extractUrl(s) { const m = (s || '').match(/https?:\/\/[^\s]+/i); return m ? m[0] : null; }

function prettify(slug) {
  const t = decodeURIComponent(slug).replace(/[-_]+/g, ' ').trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// Lit un lien d'article et en tire magasin, référence, couleur/variante et nom.
function parse(raw) {
  let u;
  try { u = new URL(raw); } catch (e) { return null; }
  const host = u.hostname.replace(/^www\./, '');
  const last = u.pathname.split('/').filter(Boolean).pop() || '';
  const slug = last.replace(/\.html?$/i, '');
  const info = { store: host, base: null, variant: null, name: prettify(slug) || host, url: u.origin + u.pathname + (/zara\./.test(host) && u.searchParams.get('v1') ? '?v1=' + u.searchParams.get('v1') : '') };

  if (/zalando\./.test(host)) {
    info.store = 'Zalando';
    const m = u.pathname.match(/-([a-z0-9]{9})-([a-z0-9]{3})\.html/i);
    if (m) {
      info.base = m[1].toUpperCase();
      info.variant = m[2].toUpperCase();
      info.name = prettify(slug.slice(0, slug.length - 14));
    }
  } else if (/zara\./.test(host)) {
    info.store = 'Zara';
    const m = u.pathname.match(/-p(\d{6,9})\.html/i);
    if (m) {
      info.base = m[1];
      info.variant = u.searchParams.get('v1') || '';
      info.name = prettify(slug.replace(/-p\d{6,9}$/i, ''));
    }
  }
  info.key = info.base ? `${info.store}:${info.base}:${info.variant || ''}` : `${info.store}:${u.pathname}`;
  return info;
}

function setCurrent(url) {
  const info = parse(url);
  if (!info) { toast('Lien non reconnu'); return; }
  current = info;
  renderCurrent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function entriesFor(key) {
  return items.filter((i) => i.key === key).sort((a, b) => b.date.localeCompare(a.date));
}

function goHome() {
  current = null;
  renderCurrent();
  $('#paste').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCurrent() {
  const box = $('#current');
  $('#homebtn').hidden = !current;
  if (!current) { box.innerHTML = ''; return; }
  const mine = entriesFor(current.key);
  const similar = current.base ? items.filter((i) => i.store === current.store && i.base === current.base && i.key !== current.key) : [];

  let verdict;
  if (mine.length) {
    const allBack = mine.every((i) => i.status === 'renvoye');
    const count = mine.length > 1 ? ` (${mine.length} fois)` : '';
    const lines = mine.map((i) => `<div class="line" data-size="${esc(i.size)}" data-note="${esc(i.note)}"><span class="sz">${i.size ? 'Taille ' + esc(i.size) : 'Sans taille'}</span><span class="badge b-${i.status}">${LABELS[i.status]}</span><span class="d">${fmtDate(i.date)}</span>${i.note ? `<span class="note">Motif : ${esc(i.note)}</span>` : ''}</div>`).join('');
    verdict = allBack
      ? `<div class="verdict v-bad">❌ Déjà commandé, puis renvoyé${count}<div class="lines">${lines}</div></div>`
      : `<div class="verdict v-warn">⚠️ Déjà commandé${count}<div class="lines">${lines}</div></div>`;
  } else if (similar.length) {
    const s = similar[0];
    verdict = `<div class="verdict v-warn">🟡 Même modèle déjà dans ton historique (autre couleur)<small>${LABELS[s.status]} le ${fmtDate(s.date)}${s.size ? ' · taille ' + esc(s.size) : ''}</small></div>`;
  } else {
    verdict = `<div class="verdict v-ok">✅ Jamais commandé</div>`;
  }

  box.innerHTML = `
    <div class="card">
      <div class="store">${esc(current.store)}</div>
      <div class="name">${esc(current.name)}</div>
      ${verdict}
      <input id="size" type="text" placeholder="Taille (ex : M, 42, 29x30)" autocomplete="off">
      <input id="note" type="text" placeholder="Motif / note (ex : trop petit)" autocomplete="off" style="margin-top:8px">
      <div class="btns">
        ${Object.keys(LABELS).map((k) => `<button data-s="${k}">${LABELS[k]}</button>`).join('')}
      </div>
      <p class="hint">${mine.length > 1 ? 'Plusieurs tailles : appuie sur une ligne pour la modifier, ou écris une nouvelle taille.' : 'Une autre taille s\'ajoute en nouvelle ligne, la même taille est mise à jour.'}</p>
    </div>`;
  if (mine.length === 1) { $('#size').value = mine[0].size; refreshButtons(); }
}

function refreshButtons() {
  if (!current) return;
  const size = ($('#size')?.value || '').trim().toLowerCase();
  const ex = items.find((i) => i.id === current.key + '|' + size);
  document.querySelectorAll('.btns button').forEach((b) => b.classList.toggle('on', !!ex && ex.status === b.dataset.s));
}

function setStatus(status) {
  if (!current) return;
  let size = ($('#size')?.value || '').trim();
  const note = ($('#note')?.value || '').trim();
  const mine = entriesFor(current.key);
  if (!size && mine.length > 1) { toast('Plusieurs tailles : appuie sur une ligne'); return; }
  if (!size && mine.length === 1) size = mine[0].size;
  const id = current.key + '|' + size.toLowerCase();
  const now = new Date().toISOString();
  let ex = items.find((i) => i.id === id);
  if (!ex && size) { const blank = mine.find((i) => !i.size); if (blank) { ex = blank; ex.id = id; } }
  if (ex) { ex.status = status; ex.size = size; ex.date = now; if (note) ex.note = note; }
  else items.push({ ...current, id, status, size, note, date: now });
  save();
  renderCurrent();
  renderList();
  toast('Enregistré : ' + LABELS[status] + (size ? ' · ' + size : ''));
}

function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  const rows = items
    .filter((i) => !q || [i.name, i.store, i.size, i.note].join(' ').toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date));
  $('#list').innerHTML = rows.length
    ? rows.map((i) => `
      <div class="item" data-open="${esc(i.id)}">
        <div class="t">
          <div class="n">${esc(i.name)}</div>
          <div class="m">${esc(i.store)} · ${fmtDate(i.date)}${i.size ? ' · ' + esc(i.size) : ''}${i.note ? ' · ' + esc(i.note) : ''}</div>
        </div>
        <span class="badge b-${i.status}">${LABELS[i.status]}</span>
        <button class="del" data-del="${esc(i.id)}" aria-label="Supprimer">×</button>
      </div>`).join('')
    : `<div class="empty">${items.length ? 'Aucun résultat' : 'Rien pour l\'instant'}</div>`;
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#homebtn, #home')) { goHome(); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const id = del.dataset.del;
    if (confirm('Supprimer cette ligne de l\'historique ?')) {
      items = items.filter((i) => i.id !== id);
      save(); renderList(); renderCurrent();
    }
    return;
  }
  const st = e.target.closest('[data-s]');
  if (st) { setStatus(st.dataset.s); return; }
  const ln = e.target.closest('.line');
  if (ln) { const inp = $('#size'); if (inp) { inp.value = ln.dataset.size; const nt = $('#note'); if (nt) nt.value = ln.dataset.note || ''; refreshButtons(); } return; }
  const op = e.target.closest('[data-open]');
  if (op) { const it = items.find((i) => i.id === op.dataset.open); if (it) setCurrent(it.url); }
});

document.addEventListener('input', (e) => { if (e.target.id === 'size') refreshButtons(); });

$('#check').addEventListener('click', () => {
  const url = extractUrl($('#paste').value) || $('#paste').value.trim();
  if (!url) return;
  setCurrent(url);
  $('#paste').value = '';
});
$('#search').addEventListener('input', renderList);

$('#export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'deja-commande-sauvegarde.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error();
    const map = new Map(items.map((i) => [i.id, i]));
    data.forEach((i) => { if (i && i.key && i.status) { migrate(i); map.set(i.id, i); } });
    items = [...map.values()];
    save(); renderList();
    toast('Sauvegarde restaurée');
  } catch (err) { toast('Fichier invalide'); }
  e.target.value = '';
});

// Démarrage : lien reçu via « Partager » ?
(function init() {
  const p = new URLSearchParams(location.search);
  const shared = [p.get('url'), p.get('text'), p.get('title')].map(extractUrl).find(Boolean);
  if (shared) { setCurrent(shared); history.replaceState(null, '', location.pathname); }
  renderList();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
